<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: rgb(65, 18, 18);
            color: #1e293b;
            min-height: 100vh;
        }
        h1{
            text-align: center;
            color: #f8fafc;
            margin-top: 40px;
            font-size: 32px;
        }
        .p1{
            width: 90%;
            margin: 15px auto;
            color: #d1d5db;
            text-align: center;
        }
        .sec1{
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
        }
        .a1{
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 26px;
            background: #532121;
            border: 1px solid #754040;
            border-radius: 18px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.2);
            transition:transform 0.25s ease,box-shadow 0.25s ease,border-color 0.25s ease;
        }
        .a1:hover{
            transform: translateY(-6px);
            border-color: #c7d2fe;
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.2);
        }
        .d2{
            width: 58px;
            height: 58px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 5px 12px rgba(99, 102, 241, 0.2);
            margin-bottom: 20px;
        }
        .d3 h3{
            font-size: 20px;
            font-weight: 700;
            color: #d7ddeb;
            overflow-wrap: anywhere;
            margin-bottom: 7px;
        }
        .d3 p{
            display: inline-block;
            padding: 6px 10px;
            background: #1a295a;
            color: #e8e7ef;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .d5{
            margin-top: 20px;
            color: #c4b5fd;
            font-size: 14px;
            font-weight: 700;
            transition: color 0.2s ease;
        }
        .a1:hover .d5{
            color: #ffffff;
        }
        .d1{
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #fecaca;
            border-radius: 12px;
            background: #fef2f2;
            color: #b91c1c;
            text-align: center;
        }
        .empty{
            grid-column: 1 / -1;
            text-align: center;
            color: #f8fafc;
            padding: 20px;
        }
        .a1:focus-visible{
            outline: 3px solid #818cf8;
            outline-offset: 4px;
        }
        @media (max-width: 900px){
            .sec1{
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 18px;
            }
        }
        @media (max-width: 580px){
            h1{
                font-size: 26px;
            }
            .sec1{
                width: 92%;
                grid-template-columns: 1fr;
                gap: 16px;
                margin: 25px auto;
            }
            .a1{
                padding: 22px;
                border-radius: 15px;
            }
            .d3 h3{
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    {% if error %}
        <div class="d1">{{ error }}</div>
    {% else %}
    <section class="sec1" id="sec">
        {% for employee in employees %}
        <a class="a1" href="{% url 'employee_details' forloop.counter0 %}">
            <div class="d2">{{ employee.name|first|upper }}</div>
            <div class="d3">
                <h3>{{ employee.name }}</h3>
                <p>Employee</p>
            </div>
            <div class="d5">View profile →</div>
        </a>
        {% empty %}
            <p class="empty">No employee records are available.</p>
        {% endfor %}
    </section>
    {% endif %}
</body>
</html>
